# Catalog-neutral, Linux ARM64 Phase 1 and Phase 2 topology.
#
# The network, object store, and state volumes are owned by this Compose project.
# Nothing depends on ~/src/boat, a host process, or a pre-created Docker network.
# All credentials below are fixed, non-production benchmark fixtures.

x-minio-image: &minio-image catalog-bench/minio:RELEASE.2025-10-15T17-29-55Z
x-minio-build: &minio-build
  context: .
  dockerfile: docker/minio/Dockerfile
  args:
    MINIO_TAG: RELEASE.2025-10-15T17-29-55Z
    MINIO_REVISION: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    CATALOG_BENCH_HELPER_SOURCE_REVISION: f2f66ee45574a64d1e76330e95e7aa551c3a148b
  additional_contexts:
    catalog-bench-helper-source: "https://github.com/querygraph/catalog-bench.git#f2f66ee45574a64d1e76330e95e7aa551c3a148b"
x-lakekeeper-image: &lakekeeper-image quay.io/lakekeeper/catalog:v0.13.3@sha256:db2ba6168eb107f22242fb7f2edc4016fa35e57bdcc606894e809c418e32e8dc
x-gravitino-image: &gravitino-image apache/gravitino-iceberg-rest:1.3.0@sha256:80136ae753ee77735153fc1482a389018f8c2638a54f453cb96967c7194584c7
x-bench-image: &bench-image catalog-bench-commit:e5345a260a42
x-bench-build: &bench-build
  context: "https://github.com/querygraph/catalog-bench.git#e5345a260a42148aa5cd1044fb3f43acfc2232d2"
  dockerfile: docker/bench.Dockerfile
  args:
    CATALOG_BENCH_SOURCE_REVISION: e5345a260a42148aa5cd1044fb3f43acfc2232d2
x-engine-runner-image: &engine-runner-image catalog-bench-engine:59840b95c33e
x-engine-runner-build: &engine-runner-build
  context: "https://github.com/querygraph/catalog-bench.git#59840b95c33e753919f5c984d10d6df45c834243"
  dockerfile: docker/bench.Dockerfile
  args:
    CATALOG_BENCH_SOURCE_REVISION: 59840b95c33e753919f5c984d10d6df45c834243
x-spark-image: &spark-image catalog-bench/spark:4.1.3-iceberg1.11.0
x-spark-build: &spark-build
  context: .
  dockerfile: docker/spark/Dockerfile
  args:
    CATALOG_BENCH_SOURCE_REVISION: 59840b95c33e753919f5c984d10d6df45c834243
    SPARK_BASE_IMAGE: catalog-bench/spark-base:4.1.3-arm64-bf9d035a
    SPARK_SOURCE_REVISION: 77bbf77e86ad48f58b5dfbc6ac882b3e70cf1989
    ICEBERG_SOURCE_REVISION: 6976e020b894f6a6777704df2b8c4458cb291ae9
  additional_contexts:
    catalog-bench-engine-runner: "service:engine-runner-image"
x-flink-engine-runner-image: &flink-engine-runner-image catalog-bench-engine-flink:36906515b69a
x-flink-engine-runner-build: &flink-engine-runner-build
  context: "https://github.com/querygraph/catalog-bench.git#36906515b69a61ac26d44327b2a9ff94c2b84551"
  dockerfile: docker/bench.Dockerfile
  args:
    CATALOG_BENCH_SOURCE_REVISION: 36906515b69a61ac26d44327b2a9ff94c2b84551
x-flink-image: &flink-image catalog-bench/flink:2.1.3-iceberg1.11.0
x-flink-build: &flink-build
  context: "https://github.com/querygraph/catalog-bench.git#36906515b69a61ac26d44327b2a9ff94c2b84551"
  dockerfile: docker/flink/Dockerfile
  args:
    CATALOG_BENCH_SOURCE_REVISION: 36906515b69a61ac26d44327b2a9ff94c2b84551
    FLINK_BASE_IMAGE: catalog-bench/flink-base:2.1.3-arm64-99a499ed
    FLINK_SOURCE_REVISION: 6cda56b084d5c337b36d2f8ed464bc92093b0a34
    ICEBERG_SOURCE_REVISION: 6976e020b894f6a6777704df2b8c4458cb291ae9
  additional_contexts:
    catalog-bench-engine-runner: "service:flink-engine-runner-base"
x-rust-runner: &rust-runner
  build: *bench-build
  image: *bench-image
  platform: linux/arm64
  networks: [lakehouse-net]
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777
x-spark-runtime: &spark-runtime
  image: *spark-image
  platform: linux/arm64
  networks: [lakehouse-net]
  profiles: ["spark"]
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    # JVM dependencies extract architecture-specific native libraries here.
    # The bounded ephemeral mount must therefore permit execution.
    - /tmp:size=512m,mode=1777,exec
  volumes:
    - ./profiles:/contracts/profiles:ro
    - ./scenarios:/contracts/scenarios:ro
    - ${CATALOG_BENCH_SPARK_EVIDENCE_DIR:-./target/spark-evidence}:/evidence
  depends_on:
    minio-init:
      condition: service_completed_successfully
x-flink-runtime: &flink-runtime
  image: *flink-image
  platform: linux/arm64
  networks: [lakehouse-net]
  profiles: ["flink"]
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=512m,mode=1777,exec
  volumes:
    - ./profiles:/contracts/profiles:ro
    - ./scenarios:/contracts/scenarios:ro
    - ${CATALOG_BENCH_FLINK_EVIDENCE_DIR:-./target/flink-evidence}:/evidence
  depends_on:
    minio-init:
      condition: service_completed_successfully
x-lakekeeper-environment: &lakekeeper-environment
  LAKEKEEPER__AUTHZ_BACKEND: allowall
  LAKEKEEPER__ENABLE_DEFAULT_PROJECT: "true"
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper-local-only@postgresql:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper-local-only@postgresql:5432/lakekeeper
  LAKEKEEPER__PG_ENCRYPTION_KEY: catalog-bench-local-only-encryption-key
  RUST_LOG: info
x-polaris-setup-environment: &polaris-setup-environment
  POLARIS_URL: http://polaris:8181
  POLARIS_REALM: POLARIS
  POLARIS_CLIENT_ID: root
  POLARIS_CLIENT_SECRET: secret
  POLARIS_SCOPE: PRINCIPAL_ROLE:ALL
  POLARIS_CATALOG: bench
  POLARIS_BASE_LOCATION: s3://warehouse/bench
  POLARIS_S3_ENDPOINT: http://minio:9000
  POLARIS_S3_STS_ENDPOINT: http://minio:9000
  POLARIS_S3_ROLE_ARN: arn:aws:iam::000000000000:role/polaris-bench
  POLARIS_S3_REGION: us-east-1

services:
  # Exact source-built community MinIO. Host ports are intentionally omitted:
  # benchmark traffic stays on the one Docker network and cannot collide with a
  # separately running developer MinIO.
  minio:
    build: *minio-build
    image: *minio-image
    networks: [lakehouse-net]
    expose: ["9000", "9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  # Idempotent bucket initialization uses a typed helper compiled into the same
  # source-built image; it does not pull a mutable mc/aws-cli utility image.
  minio-init:
    image: *minio-image
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/ensure-bucket"]
    command: []
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: warehouse
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
    depends_on:
      minio:
        condition: service_healthy
    # The image-level probe checks a running MinIO server. This service is an
    # intentionally short-lived helper, so inheriting that probe would label a
    # successful exit as unhealthy in `docker compose ps`.
    healthcheck:
      disable: true

  # Lakekeeper's private catalog state is isolated in its own database and
  # volume. No other catalog shares this database in Phase 1.
  postgresql:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    platform: linux/arm64
    profiles: ["lakekeeper"]
    networks: [lakehouse-net]
    expose: ["5432"]
    environment:
      POSTGRES_DB: lakekeeper
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper-local-only
    volumes:
      - lakekeeper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper -p 5432"]
      interval: 2s
      timeout: 5s
      start_period: 10s
      retries: 30

  lakekeeper-migrate:
    image: *lakekeeper-image
    platform: linux/arm64
    profiles: ["lakekeeper"]
    networks: [lakehouse-net]
    restart: "no"
    command: ["migrate"]
    environment: *lakekeeper-environment
    depends_on:
      postgresql:
        condition: service_healthy

  lakekeeper:
    image: *lakekeeper-image
    platform: linux/arm64
    profiles: ["lakekeeper"]
    networks: [lakehouse-net]
    expose: ["8181"]
    ports: ["${LAKEKEEPER_HOST_PORT:-8186}:8181"]
    command: ["serve"]
    environment: *lakekeeper-environment
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      start_period: 5s
      retries: 30

  lakekeeper-bootstrap:
    image: *minio-image
    profiles: ["lakekeeper"]
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/lakekeeper-setup"]
    command: ["bootstrap", "/bootstrap/bootstrap.json"]
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      LAKEKEEPER_EXPECTED_VERSION: 0.13.3
    volumes:
      - ./docker/lakekeeper:/bootstrap:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
    healthcheck:
      disable: true

  # This completed one-shot service is the Lakekeeper readiness gate: process
  # health alone is insufficient until the default project and warehouse exist.
  lakekeeper-warehouse:
    image: *minio-image
    profiles: ["lakekeeper"]
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/lakekeeper-setup"]
    command: ["warehouse", "/bootstrap/warehouse.json"]
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      LAKEKEEPER_EXPECTED_VERSION: 0.13.3
    volumes:
      - ./docker/lakekeeper:/bootstrap:ro
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  # Management initialization is not sufficient proof that the client-facing
  # Iceberg route can resolve the warehouse. This final one-shot readiness gate
  # exercises config negotiation through the same Docker network as benchmarks.
  lakekeeper-ready:
    image: *minio-image
    profiles: ["lakekeeper"]
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/lakekeeper-setup"]
    command: ["ready", "bench"]
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      LAKEKEEPER_EXPECTED_VERSION: 0.13.3
    depends_on:
      lakekeeper-warehouse:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  # Build the exact public LakeCat commit directly in Docker with the production
  # feature set and optimization recipe; no sibling checkout or host-staged
  # executable can change the image contents.
  lakecat:
    build:
      context: ./docker/lakecat
      args:
        LAKECAT_SOURCE_REVISION: 962f43cb2d2f345addf188e63be0cf6059bc26b0
      additional_contexts:
        lakecat-source: "https://github.com/querygraph/lakecat.git#962f43cb2d2f345addf188e63be0cf6059bc26b0"
    image: lakecat-service:962f43cb2d2f
    networks: [lakehouse-net]
    ports: ["8181:8181"]
    environment:
      LAKECAT_BIND_ADDR: 0.0.0.0:8181
      LAKECAT_WAREHOUSE: local
      LAKECAT_TURSO_PATH: /data/lakecat.db
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_ALLOW_HTTP: "true"
    volumes:
      - lakecat-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  lakecat-ready:
    image: *minio-image
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/wait-http"]
    command: []
    environment:
      READY_URL: http://lakecat:8181/catalog/v1/config
    depends_on:
      lakecat:
        condition: service_started
    healthcheck:
      disable: true

  # Optional catalog profiles are retained for behavior work. C1-02 validates
  # their current-version adapter bindings before any new evidence is accepted.
  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.4-java@sha256:c0f42874c810f28ac30fc991e979c1b8cf5a2cbfa94212086cdddeae49629517
    platform: linux/arm64
    networks: [lakehouse-net]
    ports: ["19120:19120"]
    profiles: ["nessie"]
    environment:
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: warehouse
      NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: s3://warehouse/
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE: STATIC
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY: urn:nessie-secret:quarkus:s3creds
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000
      # Stock clients run on this same Docker network, so the endpoint Nessie
      # returns to clients must be resolvable there rather than host loopback.
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_EXTERNAL_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      S3CREDS_NAME: admin
      S3CREDS_SECRET: password
    depends_on:
      minio-init:
        condition: service_completed_successfully

  nessie-ready:
    image: *minio-image
    profiles: ["nessie"]
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/wait-http"]
    command: []
    environment:
      READY_URL: http://nessie:19120/iceberg/v1/config
    depends_on:
      nessie:
        condition: service_started
    healthcheck:
      disable: true

  polaris:
    image: apache/polaris:1.7.0@sha256:3495f67f38cca33892a045f7dd3f46eb52387f0fd52d4145538a772fd8aedad7
    platform: linux/arm64
    networks: [lakehouse-net]
    ports: ["8185:8181"]
    profiles: ["polaris"]
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,secret"
      polaris.realm-context.realms: POLARIS
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # Polaris does not auto-provision an Iceberg catalog. Reconcile the exact
  # management object in Docker and reject a same-name catalog with drift.
  polaris-bootstrap:
    image: *minio-image
    profiles: ["polaris"]
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/polaris-setup"]
    command: ["ensure"]
    environment: *polaris-setup-environment
    depends_on:
      polaris:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  # Management creation is not enough: require authenticated config negotiation
  # for the same warehouse before a conformance probe starts.
  polaris-ready:
    image: *minio-image
    profiles: ["polaris"]
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/polaris-setup"]
    command: ["ready"]
    environment: *polaris-setup-environment
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  # A new named volume is root-owned, while the upstream image deliberately
  # runs as UID 1000. Prepare only this private state directory as root, exit,
  # and keep the long-running catalog unprivileged.
  gravitino-state-init:
    image: *gravitino-image
    platform: linux/arm64
    networks: [lakehouse-net]
    profiles: ["gravitino"]
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        chown 1000:0 /data
        chmod 0750 /data
    volumes:
      - gravitino-data:/data
    healthcheck:
      disable: true

  gravitino:
    image: *gravitino-image
    platform: linux/arm64
    networks: [lakehouse-net]
    ports: ["9002:9001"]
    profiles: ["gravitino"]
    environment:
      # The 1.3.0 image rewrites only this exact namespace. Shorter historical
      # GRAVITINO_* names are ignored and silently retain memory + /tmp defaults.
      GRAVITINO_ICEBERG_REST_CATALOG_BACKEND: jdbc
      GRAVITINO_ICEBERG_REST_URI: jdbc:sqlite:/data/gravitino.db
      GRAVITINO_ICEBERG_REST_WAREHOUSE: s3://warehouse/
      GRAVITINO_ICEBERG_REST_IO_IMPL: org.apache.iceberg.aws.s3.S3FileIO
      GRAVITINO_ICEBERG_REST_CREDENTIAL_PROVIDERS: s3-secret-key
      GRAVITINO_ICEBERG_REST_S3_ACCESS_KEY: admin
      GRAVITINO_ICEBERG_REST_S3_SECRET_KEY: password
      GRAVITINO_ICEBERG_REST_S3_ENDPOINT: http://minio:9000
      GRAVITINO_ICEBERG_REST_S3_REGION: us-east-1
      GRAVITINO_ICEBERG_REST_S3_PATH_STYLE_ACCESS: "true"
    volumes:
      - gravitino-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
      gravitino-state-init:
        condition: service_completed_successfully

  gravitino-ready:
    image: *minio-image
    profiles: ["gravitino"]
    networks: [lakehouse-net]
    restart: "no"
    entrypoint: ["/usr/local/bin/wait-http"]
    command: []
    environment:
      READY_URL: http://gravitino:9001/iceberg/v1/config
    depends_on:
      gravitino:
        condition: service_started
    healthcheck:
      disable: true

  bench:
    <<: *rust-runner
    profiles: ["bench"]
    entrypoint: ["/usr/local/bin/catalog-bench-commit"]
    environment:
      CATALOG_BENCH_S3_ACCESS_KEY_ID: admin
      CATALOG_BENCH_S3_SECRET_ACCESS_KEY: password
      CATALOG_BENCH_POLARIS_CLIENT_ID: root
      CATALOG_BENCH_POLARIS_CLIENT_SECRET: secret
    volumes:
      - ./profiles:/contracts/profiles:ro
      - ./scenarios:/contracts/scenarios:ro
      - ${CATALOG_BENCH_COMMIT_EVIDENCE_DIR:-./target/commit-evidence}:/evidence
    depends_on:
      minio-init:
        condition: service_completed_successfully
      lakecat-ready:
        condition: service_completed_successfully
      nessie-ready:
        condition: service_completed_successfully
      polaris-ready:
        condition: service_completed_successfully
      gravitino-ready:
        condition: service_completed_successfully
      lakekeeper-ready:
        condition: service_completed_successfully

  # Runs the exact profile/scenario contracts from the same Docker network as
  # every catalog. Smoke transcripts land under target/ by default and cannot
  # be confused with a manifest-backed publishable result bundle.
  conformance:
    <<: *rust-runner
    profiles: ["conformance"]
    entrypoint: ["/usr/local/bin/catalog-bench-conformance"]
    environment:
      CATALOG_BENCH_POLARIS_CLIENT_ID: root
      CATALOG_BENCH_POLARIS_CLIENT_SECRET: secret
    volumes:
      - ./profiles:/contracts/profiles:ro
      - ./scenarios:/contracts/scenarios:ro
      - ${CATALOG_BENCH_EVIDENCE_DIR:-./target/conformance-evidence}:/evidence
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # Exact stock-client oracle for C1-07. The image contains only CPython
  # 3.13.15, hash-locked PyIceberg/PyArrow dependencies, and the value-safe
  # runner. It shares the catalogs' network and MinIO; no host Python or proxy
  # participates in evidence generation.
  pyiceberg:
    build:
      context: .
      dockerfile: docker/pyiceberg.Dockerfile
    image: catalog-bench-pyiceberg:0.11.1-python3.13.15
    platform: linux/arm64
    networks: [lakehouse-net]
    profiles: ["pyiceberg"]
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      CATALOG_BENCH_S3_ACCESS_KEY_ID: admin
      CATALOG_BENCH_S3_SECRET_ACCESS_KEY: password
      CATALOG_BENCH_POLARIS_CLIENT_ID: root
      CATALOG_BENCH_POLARIS_CLIENT_SECRET: secret
    volumes:
      - ./profiles:/contracts/profiles:ro
      - ./scenarios:/contracts/scenarios:ro
      - ${CATALOG_BENCH_PYICEBERG_EVIDENCE_DIR:-./target/pyiceberg-evidence}:/evidence
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # The connector JAR set is an independently inspectable image as well as the
  # source copied into the executed Spark image. It is built, hashed, and never
  # launched as a service.
  iceberg-spark-runtime:
    build:
      <<: *spark-build
      target: connector
    image: catalog-bench/iceberg-spark-runtime:1.11.0-spark4.1_2.13
    platform: linux/arm64
    networks: [lakehouse-net]
    profiles: ["spark"]

  # Exact source-pinned donor for the optimized Rust harness. The executed
  # Spark image copies and verifies these bytes; this service is independently
  # inspectable but is not part of a measured process tree.
  engine-runner-image:
    build: *engine-runner-build
    image: *engine-runner-image
    platform: linux/arm64
    profiles: ["spark"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/catalog-bench-engine"]
    command: ["--help"]

  # Stock Apache Spark plus only the two Iceberg 1.11.0 artifacts selected by
  # the profile. The service is a hardened one-shot runner on the same network
  # and MinIO substrate as every catalog.
  spark:
    <<: *spark-runtime
    build:
      <<: *spark-build
      target: runtime
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: ["--version"]

  # The harness and stock Spark child execute from this one immutable image.
  spark-engine:
    <<: *spark-runtime
    entrypoint: ["/usr/local/bin/catalog-bench-engine"]
    command: ["--help"]
    environment:
      CATALOG_BENCH_S3_ACCESS_KEY_ID: admin
      CATALOG_BENCH_S3_SECRET_ACCESS_KEY: password
      CATALOG_BENCH_POLARIS_CLIENT_ID: root
      CATALOG_BENCH_POLARIS_CLIENT_SECRET: secret
    depends_on:
      lakecat-ready:
        condition: service_completed_successfully
      polaris-ready:
        condition: service_completed_successfully
      gravitino-ready:
        condition: service_completed_successfully
      lakekeeper-ready:
        condition: service_completed_successfully

  # Exact source-pinned optimized Rust donor used only to construct the
  # independently inspectable composite Flink runner image.
  flink-engine-runner-base:
    build: *flink-engine-runner-build
    image: *flink-engine-runner-image
    platform: linux/arm64
    profiles: ["flink"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/catalog-bench-engine"]
    command: ["--help"]

  # Iceberg connector bytes are inspectable independently and copied unchanged
  # into the executed Flink runtime.
  iceberg-flink-runtime:
    build:
      <<: *flink-build
      target: connector
    image: catalog-bench/iceberg-flink-runtime:1.11.0-flink2.1
    platform: linux/arm64
    networks: [lakehouse-net]
    profiles: ["flink"]

  # Composite donor proving the optimized Rust ELF and Java child JAR originate
  # from the same exact public source revision.
  flink-runner-image:
    build:
      <<: *flink-build
      target: runner
    image: catalog-bench/flink-runner:36906515b69a
    platform: linux/arm64
    profiles: ["flink"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/catalog-bench-engine"]
    command: ["--help"]

  # Stock Flink plus only the source-bound runner and exact Iceberg artifacts.
  flink:
    <<: *flink-runtime
    build:
      <<: *flink-build
      target: runtime
    entrypoint: ["/opt/flink/bin/flink"]
    command: ["--version"]

  # The optimized harness and its stock Flink child execute in this one image.
  flink-engine:
    <<: *flink-runtime
    entrypoint: ["/usr/local/bin/catalog-bench-engine"]
    command: ["--help"]
    environment:
      CATALOG_BENCH_S3_ACCESS_KEY_ID: admin
      CATALOG_BENCH_S3_SECRET_ACCESS_KEY: password
      CATALOG_BENCH_POLARIS_CLIENT_ID: root
      CATALOG_BENCH_POLARIS_CLIENT_SECRET: secret
    depends_on:
      lakecat-ready:
        condition: service_completed_successfully
      polaris-ready:
        condition: service_completed_successfully
      gravitino-ready:
        condition: service_completed_successfully
      lakekeeper-ready:
        condition: service_completed_successfully

volumes:
  gravitino-data:
  lakecat-data:
  lakekeeper-postgres-data:
  minio-data:

networks:
  lakehouse-net:
    name: catalog-bench-net
    driver: bridge
