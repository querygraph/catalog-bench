[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/querygraph/catalog-bench"

# Shared dependency versions. Individual crates opt in via `{ workspace = true }`,
# so the suite pins one version of each dep in one place.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v7"] }

# Real data-write path (write-data bench only). Kept out of the other crates so the
# default workspace build stays light.
arrow = "54"
parquet = "54"
object_store = { version = "0.11", features = ["aws"] }

# The shared library, consumed by every bench + the driver.
catalog-bench-common = { path = "crates/common" }
catalog-bench-conformance = { path = "crates/conformance" }

# The cache/read benchmarks must build from a standalone checkout. Keep Sail's
# object-store boundary immutable and aligned with the LakeCat 0.3.0 dependency
# line instead of resolving whichever sibling checkout happens to be present.
sail-object-store = { git = "https://github.com/querygraph/sail.git", rev = "bddb1706ba2308e5029d47f04f03121236edbfa6", default-features = false }
