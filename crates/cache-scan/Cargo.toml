[package]
name = "catalog-bench-cache-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cold-vs-warm scan benchmark: Sail's Foyer object-store cache over MinIO/S3."

[[bin]]
name = "catalog-bench-cache-scan"
path = "src/main.rs"

[dependencies]
catalog-bench-common = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"

# Sail's Foyer object-store cache, pinned once at the workspace boundary.
# `default-features = false` skips Sail's `hdfs` feature (not needed here).
sail-object-store = { workspace = true }

# These MUST resolve to the exact same versions Sail's object-store layer uses,
# so `CachingObjectStore`'s `Arc<dyn ObjectStore>` typechecks against our reader.
# Pinned from the selected Sail revision: object_store 0.13.2,
# parquet/arrow 58.3.0.
object_store = { version = "0.13.2", features = ["aws"] }
parquet = { version = "58.3.0", features = ["async", "object_store"] }
arrow = { version = "58.3.0" }
