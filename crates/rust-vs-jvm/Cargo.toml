[package]
name = "catalog-bench-rust-vs-jvm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sail/DataFusion (Rust) vs Spark (JVM) — same filter+aggregate query over the same MinIO Parquet."

[[bin]]
name = "catalog-bench-rust-vs-jvm"
path = "src/main.rs"

[dependencies]
catalog-bench-common = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
url = "2"

# Sail's pinned Foyer object-store cache makes the Rust "warm" phase serve bytes
# from the same `CachingObjectStore` that `cache-scan` uses.
sail-object-store = { workspace = true }

# DataFusion is the engine inside Sail; this is a real engine-vs-engine read.
# These MUST resolve to the SAME versions `cache-scan` / `sail-object-store` use,
# so DataFusion shares ONE `object_store` with `CachingObjectStore`. Pinned from
# the selected Sail revision: datafusion 54.0.0, object_store 0.13.2,
# arrow 58.3.0.
#
# The feature list MIRRORS Sail's own `datafusion` dependency EXACTLY. Crucially it
# has `default-features = false` and NO `sql` feature: `sail-common-datafusion`
# (pulled transitively via sail-object-store -> sail-telemetry) is written against
# a datafusion-common WITHOUT the `sqlparser` SQL-error variant. Enabling
# DataFusion's SQL frontend here would break that crate via Cargo feature
# unification. We therefore build the query through the DataFrame API rather than
# `ctx.sql()` — same logical plan.
datafusion = { version = "54.0.0", default-features = false, features = [
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "compression",
    "parquet",
    "serde",
    "avro",
    "recursive_protection",
] }
object_store = { version = "0.13.2", features = ["aws"] }
arrow = "58.3.0"
